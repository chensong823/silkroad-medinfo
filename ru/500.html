<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>服务暂时不可用 · 丝路医讯</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0B5FAE" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;color:#0F172A;background:#F4F7FB;min-height:100vh;display:grid;place-items:center;padding:24px}
  .error-wrap{max-width:520px;text-align:center}
  .error-code{font-size:6rem;font-weight:700;color:#E63946;line-height:1;letter-spacing:-0.04em;margin-bottom:16px}
  .error-title{font-size:1.75rem;font-weight:600;margin-bottom:12px}
  .error-body{font-size:1rem;color:#475569;line-height:1.65;margin-bottom:32px}
  .error-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:8px;font-weight:500;text-decoration:none}
  .btn-primary{background:#0B5FAE;color:#fff;border:1px solid #0B5FAE}
  .btn-secondary{background:transparent;color:#0B5FAE;border:1px solid #0B5FAE}
  .silkroad{position:fixed;top:24px;left:24px;width:36px;height:36px;background:#0B5FAE;border-radius:8px;display:grid;place-items:center}
</style>
</head>
<body>
<div class="silkroad" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><rect x="9" y="3" width="6" height="18" rx="1" fill="#fff"/><rect x="3" y="9" width="18" height="6" rx="1" fill="#fff"/></svg>
</div>
<main class="error-wrap">
  <p class="error-code">500</p>
  <h1 class="error-title">服务暂时不可用</h1>
  <p class="error-body">服务器遇到了一些问题，我们的技术团队正在处理。请稍后再试。</p>
  <div class="error-actions">
    <a href="..//" class="btn btn-primary">返回首页</a>
  </div>
</main>
</body>
</html>
