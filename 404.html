<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面未找到 · 丝路医讯</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0B5FAE" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;color:#0F172A;background:#F4F7FB;min-height:100vh;display:grid;place-items:center;padding:24px}
  .error-wrap{max-width:520px;text-align:center}
  .error-code{font-size:6rem;font-weight:700;color:#0B5FAE;line-height:1;letter-spacing:-0.04em;margin-bottom:16px}
  .error-title{font-size:1.75rem;font-weight:600;margin-bottom:12px}
  .error-body{font-size:1rem;color:#475569;line-height:1.65;margin-bottom:32px}
  .error-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:8px;font-weight:500;text-decoration:none;transition:all 150ms}
  .btn-primary{background:#0B5FAE;color:#fff;border:1px solid #0B5FAE}
  .btn-primary:hover{background:#084A87;border-color:#084A87;transform:translateY(-1px)}
  .btn-secondary{background:transparent;color:#0B5FAE;border:1px solid #0B5FAE}
  .btn-secondary:hover{background:rgba(230,57,70,0.08)}
  .silkroad{position:fixed;top:24px;left:24px;width:36px;height:36px;background:#0B5FAE;border-radius:8px;display:grid;place-items:center}
  .silkroad svg{width:24px;height:24px}
</style>
</head>
<body>
<div class="silkroad" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><rect x="9" y="3" width="6" height="18" rx="1" fill="#fff"/><rect x="3" y="9" width="18" height="6" rx="1" fill="#fff"/></svg>
</div>
<main class="error-wrap">
  <p class="error-code">404</p>
  <h1 class="error-title">页面走失了</h1>
  <p class="error-body">您访问的页面不存在。可能是链接已更新，或者地址输入有误。</p>
  <div class="error-actions">
    <a href="/" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" width="18" height="18"><path d="M3 12L12 3l9 9M5 10v10h14V10"/></svg>
      返回首页
    </a>
    <a href="/services/" class="btn btn-secondary">浏览服务</a>
  </div>
</main>
</body>
</html>
